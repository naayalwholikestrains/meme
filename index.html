
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }

  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  #soundButton {
    position: fixed;
    bottom: 25px;
    right: 25px;
    z-index: 10;
    padding: 12px 20px;
    border: none;
    border-radius: 30px;
    background: rgba(30, 30, 30, 0.85);
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  #soundButton:hover {
    background: #444;
  }
</style>
</head>

<body>

<iframe
  id="youtubeVideo"
  src="https://www.youtube.com/embed/BOyAjDqQ790?autoplay=1&mute=1&loop=1&playlist=BOyAjDqQ790&controls=1&enablejsapi=1"
  allow="autoplay; encrypted-media; picture-in-picture"
  allowfullscreen>
</iframe>

<button id="soundButton" onclick="toggleSound()">
  🔇 Unmute
</button>

<script>
  const video = document.getElementById("youtubeVideo");
  const button = document.getElementById("soundButton");
  let muted = true;

  function toggleSound() {
    muted = !muted;

    video.contentWindow.postMessage(
      JSON.stringify({
        event: "command",
        func: muted ? "mute" : "unMute",
        args: []
      }),
      "https://www.youtube.com"
    );

    button.textContent = muted ? "🔇 Unmute" : "🔊 Mute";
  }
</script>

</body>
</html>
